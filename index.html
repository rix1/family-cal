<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Family Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --paper: #f6f1e8;
        --paper-strong: #fffaf1;
        --ink: #1d2422;
        --muted: #68736f;
        --soft-muted: #8a938f;
        --line: #e4dccf;
        --line-strong: #d4c8b8;
        --teal: #0f766e;
        --teal-ink: #0b4f4a;
        --teal-soft: #dff5ee;
        --amber: #b7791f;
        --amber-soft: #fff1c7;
        --blue-soft: #dceeff;
        --blue-ink: #164276;
        --red-soft: #ffe1de;
        --red-ink: #84251d;
        --shadow: 0 18px 55px rgba(52, 41, 24, 0.08), 0 2px 10px rgba(52, 41, 24, 0.05);
        --shadow-tight: 0 10px 30px rgba(52, 41, 24, 0.08), 0 1px 4px rgba(52, 41, 24, 0.05);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-feature-settings: "ss01", "ss02", "cv01";
        background:
          linear-gradient(180deg, rgba(255, 250, 241, 0.9) 0%, rgba(246, 241, 232, 0.95) 42%, rgba(247, 244, 238, 1) 100%),
          var(--paper);
        color: var(--ink);
      }

      .day-dot {
        box-shadow: 0 0 0 6px rgba(15, 118, 110, 0.12);
      }

      .topbar {
        border-color: rgba(212, 200, 184, 0.78);
        background: rgba(246, 241, 232, 0.86);
      }

      .eyebrow {
        color: var(--teal-ink);
        letter-spacing: 0.18em;
      }

      .surface {
        border: 1px solid var(--line);
        background: rgba(255, 250, 241, 0.84);
        box-shadow: var(--shadow-tight);
      }

      .surface-raised {
        border: 1px solid var(--line);
        background: rgba(255, 250, 241, 0.94);
        box-shadow: var(--shadow);
      }

      .action {
        display: inline-flex;
        min-height: 2.5rem;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 999px;
        padding: 0.625rem 1rem;
        font-size: 0.875rem;
        font-weight: 650;
        line-height: 1;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      .action:hover {
        transform: translateY(-1px);
      }

      .action-primary {
        background: var(--ink);
        color: white;
        box-shadow: 0 10px 24px rgba(29, 36, 34, 0.18);
      }

      .action-primary:hover {
        background: #2b3330;
      }

      .action-secondary {
        border: 1px solid var(--line-strong);
        background: rgba(255, 250, 241, 0.78);
        color: var(--ink);
      }

      .action-secondary:hover {
        background: white;
        box-shadow: var(--shadow-tight);
      }

      .month-bar {
        border-color: rgba(212, 200, 184, 0.78);
        background: rgba(246, 241, 232, 0.92);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        font-size: 0.84rem;
        font-weight: 600;
      }

      /* Interactive filter chips */
      .chip {
        display: inline-flex;
        cursor: pointer;
        align-items: center;
        gap: 0.35rem;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: rgba(255, 250, 241, 0.7);
        padding: 0.4rem 0.8rem;
        font-size: 0.84rem;
        font-weight: 600;
        color: var(--muted);
        transition: background 140ms ease, color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
      }

      .chip:hover {
        background: white;
      }

      .chip[aria-pressed="true"] {
        border-color: var(--teal);
        background: var(--teal-soft);
        color: var(--teal-ink);
        box-shadow: var(--shadow-tight);
      }

      .next-highlight {
        border-color: var(--teal) !important;
        background: var(--teal-soft) !important;
        box-shadow: 0 0 0 1px var(--teal) inset, var(--shadow-tight);
      }

      .toast {
        pointer-events: none;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body class="antialiased">
    <header class="topbar sticky top-0 z-20 border-b backdrop-blur-xl">
      <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-4">
        <div class="min-w-0">
          <p class="eyebrow text-xs font-semibold uppercase">Family calendar</p>
          <h1 id="today-title" class="mt-1 truncate text-xl font-semibold tracking-normal sm:text-2xl"></h1>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <a href="edit.html" class="action action-secondary" title="Add or edit people">
            <span aria-hidden="true">✏️</span>
            <span class="hidden sm:inline">Edit</span>
          </a>
          <button id="export-ics" type="button" class="action action-secondary" title="Download an .ics file you can import into Google or Apple Calendar">
            <span aria-hidden="true">📆</span>
            <span class="hidden sm:inline">Export .ics</span>
          </button>
          <button id="jump-today" type="button" class="action action-primary">Today</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 pb-20 pt-6">
      <section class="mb-6 grid gap-3 sm:grid-cols-3">
        <article class="surface-raised rounded-2xl p-5">
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-[color:var(--soft-muted)]">Today</p>
          <p id="today-detail" class="mt-4 text-4xl font-semibold tracking-normal"></p>
          <p id="today-subtitle" class="mt-2 text-sm text-[color:var(--muted)]"></p>
        </article>
        <article class="surface-raised rounded-2xl p-5 sm:col-span-2">
          <div class="flex items-center justify-between gap-3">
            <p class="text-xs font-semibold uppercase tracking-[0.16em] text-[color:var(--soft-muted)]">Next up</p>
            <p id="range-label" class="text-xs text-[color:var(--soft-muted)]"></p>
          </div>
          <div id="next-up" class="mt-3 grid gap-2 sm:grid-cols-2"></div>
        </article>
      </section>

      <section class="mb-6 grid gap-3 lg:grid-cols-[1fr_0.72fr]">
        <article class="surface rounded-2xl p-5">
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-[color:var(--soft-muted)]">Recently celebrated</p>
          <div id="recent-birthdays" class="mt-3 grid gap-2"></div>
        </article>
        <article class="surface rounded-2xl p-5">
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-[color:var(--soft-muted)]">Missing dates</p>
          <div id="missing-dates" class="mt-3 flex flex-wrap gap-2"></div>
        </article>
      </section>

      <!-- Filters + search -->
      <section class="surface mb-4 rounded-2xl p-4">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
          <label class="relative block w-full lg:max-w-xs">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[color:var(--soft-muted)]">🔍</span>
            <input
              id="search"
              type="search"
              placeholder="Search by name or note…"
              class="w-full rounded-full border border-[color:var(--line-strong)] bg-white/70 py-2 pl-9 pr-3 text-sm outline-none focus:border-[color:var(--teal)]"
            />
          </label>
          <div class="flex flex-wrap items-center gap-2">
            <div id="group-filters" class="flex flex-wrap items-center gap-2"></div>
            <span class="hidden h-5 w-px bg-[color:var(--line-strong)] sm:inline-block"></span>
            <div id="type-filters" class="flex flex-wrap items-center gap-2"></div>
          </div>
        </div>
      </section>

      <section id="calendar" class="space-y-8"></section>
      <p id="empty-state" class="hidden rounded-2xl border border-dashed border-[color:var(--line-strong)] bg-white/50 p-6 text-center text-sm text-[color:var(--soft-muted)]"></p>
    </main>

    <div id="toast" class="toast fixed bottom-4 left-1/2 z-30 w-[calc(100%-2rem)] max-w-sm -translate-x-1/2 rounded-2xl border border-[color:var(--line)] bg-[color:var(--paper-strong)] px-4 py-3 text-sm text-[color:var(--ink)] shadow-[var(--shadow)]"></div>

    <script>
      // Data is loaded at startup from the server API. These are filled by
      // ingest() before the first render.
      let groups = {};
      let people = [];
      let holidays = [];

      const today = new Date();
      const todayKey = toKey(today);
      const currentYear = today.getFullYear();
      const startYear = currentYear - 2;
      const endYear = currentYear + 2;
      const dayFormatter = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric" });
      const longDateFormatter = new Intl.DateTimeFormat("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric",
      });
      const monthFormatter = new Intl.DateTimeFormat("en-GB", { month: "long", year: "numeric" });

      // Active filter state. Type "holiday" is included only if there are holidays.
      // Sets are repopulated by ingest(); the object identity is kept stable so
      // closures below always read the current selection.
      let allTypes = [];
      const state = {
        groups: new Set(),
        types: new Set(),
        query: "",
      };

      function ingest(d) {
        groups = d.groups || {};
        people = d.people || [];
        holidays = (d.holidays || []).map((h) => ({ ...h, type: "holiday" }));
        allTypes = Array.from(
          new Set([...people.map((p) => p.type || "birthday"), ...(holidays.length ? ["holiday"] : [])]),
        );
        state.groups = new Set(Object.keys(groups));
        state.types = new Set(allTypes);
      }

      // Map the server's Person shape to the view's person shape.
      function fromServer(api) {
        const groupsMap = {};
        for (const g of api.groups || []) groupsMap[g.key] = { label: g.label, flag: g.flag };
        const ppl = (api.people || []).map((p) => ({
          name: p.name,
          date: p.born || "",
          type: "birthday",
          group: (p.groups && p.groups[0]) || "",
          notes: p.notes || "",
          died: p.died || "",
        }));
        return { groups: groupsMap, people: ppl, holidays: api.holidays || [] };
      }

      function toKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseDate(key) {
        const [year, month, day] = key.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function addDays(date, days) {
        const next = new Date(date);
        next.setDate(next.getDate() + days);
        return next;
      }

      // Returns "MM-DD" for full or recurring dates, or "" if no date is known.
      function monthDayOf(person) {
        if (!person.date) return "";
        return person.date.length === 10 ? person.date.slice(5) : person.date;
      }

      function hasYear(person) {
        return Boolean(person.date) && person.date.length === 10;
      }

      function ageOn(person, year) {
        return hasYear(person) ? year - Number(person.date.slice(0, 4)) : null;
      }

      function milestone(age) {
        if (!Number.isFinite(age)) return "";
        if ([1, 10, 18, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90, 100].includes(age)) return "✨";
        if (age > 0 && age % 10 === 0) return "✨";
        if (age > 0 && age % 5 === 0) return "⭐";
        return "";
      }

      function typeLabel(type) {
        if (type === "birthday") return "🎂 Birthdays";
        if (type === "anniversary") return "💍 Anniversaries";
        if (type === "holiday") return "🇳🇴🇩🇰 Holidays";
        return type;
      }

      function typeIcon(type) {
        if (type === "anniversary") return "💍";
        return "🎂";
      }

      function personEventsForYear(year) {
        return people
          .filter((person) => person.date)
          .map((person) => {
            const monthDay = monthDayOf(person);
            const date = `${year}-${monthDay}`;
            // Skip years before the person was born (when the year is known).
            if (hasYear(person) && date < person.date) return null;
            const age = ageOn(person, year);
            return {
              date,
              type: person.type || "birthday",
              name: person.name,
              person,
              age,
              flare: milestone(age),
            };
          })
          .filter(Boolean);
      }

      function allEvents() {
        const events = [];
        for (let year = startYear; year <= endYear; year++) {
          events.push(...personEventsForYear(year));
        }
        events.push(...holidays.filter((h) => Number(h.date.slice(0, 4)) >= startYear && Number(h.date.slice(0, 4)) <= endYear));
        return events.sort((a, b) => a.date.localeCompare(b.date) || a.type.localeCompare(b.type));
      }

      function matchesFilters(event) {
        if (!state.types.has(event.type)) return false;
        // Group filter only applies to people (holidays are toggled via type).
        if (event.person && !state.groups.has(event.person.group)) return false;
        if (state.query) {
          const haystack = `${event.name} ${event.person ? event.person.notes || "" : ""}`.toLowerCase();
          if (!haystack.includes(state.query)) return false;
        }
        return true;
      }

      function relativeLabel(dateKey) {
        const ms = parseDate(dateKey) - parseDate(todayKey);
        const days = Math.round(ms / 86400000);
        if (days === 0) return "today";
        if (days === 1) return "tomorrow";
        if (days === -1) return "yesterday";
        if (days > 0) return `in ${days} days`;
        return `${Math.abs(days)} days ago`;
      }

      function ageText(event, { explicit } = {}) {
        if (event.age == null) return "";
        if (event.date < todayKey) return `turned ${event.age}`;
        if (event.date === todayKey) return explicit ? `turns ${event.age} today` : `turns ${event.age} today`;
        return `turns ${event.age}`;
      }

      function renderSummary(events) {
        document.querySelector("#today-title").textContent = longDateFormatter.format(today);
        document.querySelector("#today-detail").textContent = today.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
        const peopleCount = state.groups.size === Object.keys(groups).length ? people.length : people.filter((p) => state.groups.has(p.group)).length;
        document.querySelector("#today-subtitle").textContent = `${peopleCount} people · ${startYear}–${endYear}`;
        document.querySelector("#range-label").textContent = "next 120 days";

        const upcoming = events.filter((e) => e.type !== "holiday" && e.date >= todayKey);
        const nextWindow = upcoming.filter((e) => e.date <= toKey(addDays(today, 120))).slice(0, 6);
        document.querySelector("#next-up").innerHTML = nextWindow.length
          ? nextWindow.map((e, i) => summaryCard(e, { highlight: i === 0 })).join("")
          : `<p class="text-sm text-[color:var(--muted)]">Nothing in the next 120 days for this filter.</p>`;

        const recent = events
          .filter((e) => e.type !== "holiday" && e.date < todayKey && e.date >= toKey(addDays(today, -90)))
          .reverse()
          .slice(0, 5);
        document.querySelector("#recent-birthdays").innerHTML = recent.length
          ? recent.map((e) => summaryCard(e)).join("")
          : `<p class="text-sm text-[color:var(--muted)]">Nothing in the last 90 days for this filter.</p>`;

        const missing = people.filter((p) => !p.date && state.groups.has(p.group));
        document.querySelector("#missing-dates").innerHTML = missing.length
          ? missing
              .map(
                (p) =>
                  `<span class="rounded-full border border-[color:var(--line)] bg-white/70 px-3 py-1 text-sm font-medium text-[color:var(--muted)]" title="${escapeHtml(p.notes || "")}">${escapeHtml(p.name)}</span>`,
              )
              .join("")
          : `<p class="text-sm text-[color:var(--muted)]">All dates filled in 🎉</p>`;
      }

      function summaryCard(event, { highlight } = {}) {
        const age = ageText(event);
        return `
          <div class="${highlight ? "next-highlight" : ""} flex items-center gap-3 rounded-xl border border-[color:var(--line)] bg-white/70 px-3 py-2.5 shadow-sm">
            <div class="grid size-11 place-items-center rounded-xl bg-[color:var(--teal-soft)] text-lg">${event.flare || typeIcon(event.type)}</div>
            <div class="min-w-0">
              <p class="truncate font-medium">${escapeHtml(event.name)}${highlight ? ' <span class="text-xs font-semibold text-[color:var(--teal-ink)]">· next up</span>' : ""}</p>
              <p class="text-sm text-[color:var(--muted)]">${relativeLabel(event.date)}${age ? ` · ${age}` : ""}</p>
            </div>
          </div>
        `;
      }

      function countryPills(countries) {
        return countries
          .map((country) => {
            const styles = country === "NO" ? "bg-[color:var(--blue-soft)] text-[color:var(--blue-ink)]" : "bg-[color:var(--red-soft)] text-[color:var(--red-ink)]";
            const flag = country === "NO" ? "🇳🇴" : "🇩🇰";
            return `<span class="rounded-full px-2.5 py-1 text-xs font-semibold ${styles}">${flag} ${country}</span>`;
          })
          .join("");
      }

      function renderEvent(event) {
        if (event.type === "holiday") {
          return `
            <div class="rounded-xl border border-[color:var(--line)] bg-white/70 px-3.5 py-3 shadow-sm">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <p class="font-medium text-[color:var(--ink)]">Holiday · ${escapeHtml(event.name)}</p>
                <div class="flex gap-1">${countryPills(event.countries)}</div>
              </div>
            </div>
          `;
        }

        const text = ageText(event, { explicit: true });
        const note = event.person.notes || "";
        const group = groups[event.person.group];
        const groupChip = group ? `<span class="rounded-full bg-white/70 px-2 py-0.5 text-xs font-medium text-[color:var(--muted)]">${group.flag} ${escapeHtml(group.label)}</span>` : "";
        const milestoneClass = event.flare
          ? "border-[color:var(--amber)] bg-[color:var(--amber-soft)]"
          : "border-[color:var(--line)] bg-white/80";
        return `
          <div class="rounded-xl border ${milestoneClass} px-3.5 py-3 shadow-sm">
            <div class="flex items-start gap-3">
              <div class="grid size-10 shrink-0 place-items-center rounded-xl bg-[color:var(--teal-soft)] text-lg">${event.flare || typeIcon(event.type)}</div>
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <p class="font-semibold">${escapeHtml(event.name)}</p>
                  ${event.flare ? `<span class="rounded-full bg-white/70 px-2.5 py-1 text-xs font-semibold text-amber-950">${event.age} ${event.flare}</span>` : ""}
                  ${groupChip}
                </div>
                <p class="text-sm text-[color:var(--muted)]">${[text, escapeHtml(note)].filter(Boolean).join(" · ") || "Birthday"}</p>
              </div>
            </div>
          </div>
        `;
      }

      function renderCalendar(events) {
        const calendar = document.querySelector("#calendar");
        const emptyState = document.querySelector("#empty-state");

        if (!events.length) {
          calendar.innerHTML = "";
          emptyState.textContent = "No events match the current filters.";
          emptyState.classList.remove("hidden");
          return;
        }
        emptyState.classList.add("hidden");

        const byMonth = new Map();
        for (const event of events) {
          const monthKey = event.date.slice(0, 7);
          if (!byMonth.has(monthKey)) byMonth.set(monthKey, []);
          byMonth.get(monthKey).push(event);
        }

        const sections = [];
        for (let year = startYear; year <= endYear; year++) {
          for (let month = 1; month <= 12; month++) {
            const monthKey = `${year}-${String(month).padStart(2, "0")}`;
            const monthEvents = byMonth.get(monthKey) || [];
            if (!monthEvents.length) continue;

            const dayGroups = new Map();
            for (const event of monthEvents) {
              if (!dayGroups.has(event.date)) dayGroups.set(event.date, []);
              dayGroups.get(event.date).push(event);
            }

            sections.push(`
              <section id="month-${monthKey}" class="scroll-mt-24">
                <div class="month-bar sticky top-[73px] z-10 -mx-4 border-y px-4 py-3 backdrop-blur-xl">
                  <div class="mx-auto flex max-w-5xl items-center justify-between">
                    <h2 class="text-lg font-semibold">${monthFormatter.format(new Date(year, month - 1, 1))}</h2>
                    <span class="text-sm font-medium text-[color:var(--soft-muted)]">${monthEvents.length} ${monthEvents.length === 1 ? "event" : "events"}</span>
                  </div>
                </div>
                <div class="mt-4 space-y-4">
                  ${Array.from(dayGroups)
                    .map(([date, dayEvents]) => renderDay(date, dayEvents))
                    .join("")}
                </div>
              </section>
            `);
          }
        }

        calendar.innerHTML = sections.join("");
      }

      function renderDay(dateKey, events) {
        const isToday = dateKey === todayKey;
        return `
          <div class="grid gap-3 sm:grid-cols-[88px_1fr]">
            <div class="flex items-start gap-3 sm:block">
              <div class="${isToday ? "day-dot bg-[color:var(--teal)] text-white" : "bg-[color:var(--paper-strong)] text-[color:var(--ink)]"} grid size-14 place-items-center rounded-2xl border border-[color:var(--line)] text-center shadow-sm">
                <div>
                  <div class="text-lg font-semibold leading-none">${parseDate(dateKey).getDate()}</div>
                  <div class="mt-1 text-[10px] font-medium uppercase">${dayFormatter.format(parseDate(dateKey)).slice(0, 3)}</div>
                </div>
              </div>
              ${isToday ? `<span class="mt-4 rounded-full bg-[color:var(--teal-soft)] px-2.5 py-1 text-xs font-semibold text-[color:var(--teal-ink)] sm:mt-2 sm:inline-block">Today</span>` : ""}
            </div>
            <div class="space-y-2">
              ${events.map(renderEvent).join("")}
            </div>
          </div>
        `;
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      // --- Filter UI ---
      function renderFilterChips() {
        const groupContainer = document.querySelector("#group-filters");
        groupContainer.innerHTML = Object.entries(groups)
          .map(
            ([key, g]) =>
              `<button type="button" class="chip" data-group="${key}" aria-pressed="${state.groups.has(key)}">${g.flag} ${escapeHtml(g.label)}</button>`,
          )
          .join("");

        const typeContainer = document.querySelector("#type-filters");
        typeContainer.innerHTML = allTypes
          .map(
            (type) =>
              `<button type="button" class="chip" data-type="${type}" aria-pressed="${state.types.has(type)}">${typeLabel(type)}</button>`,
          )
          .join("");
      }

      function toggleSet(set, key, fallbackKeys) {
        if (set.has(key)) {
          set.delete(key);
          // Never leave an empty set: re-enable everything if the user deselects the last one.
          if (set.size === 0) fallbackKeys.forEach((k) => set.add(k));
        } else {
          set.add(key);
        }
      }

      function rerender() {
        const events = allEvents().filter(matchesFilters);
        renderSummary(events);
        renderCalendar(events);
        renderFilterChips();
      }

      // --- iCal (.ics) export of the currently filtered people ---
      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function buildIcs() {
        const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//family-cal//Family Calendar//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
        const stamp = `${today.getUTCFullYear()}${pad(today.getUTCMonth() + 1)}${pad(today.getUTCDate())}T000000Z`;

        const exported = people.filter((p) => p.date && state.groups.has(p.group) && state.types.has(p.type || "birthday"));
        if (state.query) {
          // Respect the search box too.
          const q = state.query;
          for (let i = exported.length - 1; i >= 0; i--) {
            const hay = `${exported[i].name} ${exported[i].notes || ""}`.toLowerCase();
            if (!hay.includes(q)) exported.splice(i, 1);
          }
        }

        exported.forEach((p, i) => {
          const md = monthDayOf(p).replace("-", "");
          const startYearForEvent = hasYear(p) ? p.date.slice(0, 4) : "2000";
          const summary = `${typeIcon(p.type || "birthday")} ${p.name}${(p.type || "birthday") === "birthday" ? "" : ` (${p.type})`}`;
          const uid = `${md}-${i}-${p.name.replace(/[^a-z0-9]/gi, "")}@family-cal`;
          lines.push(
            "BEGIN:VEVENT",
            `UID:${uid}`,
            `DTSTAMP:${stamp}`,
            `DTSTART;VALUE=DATE:${startYearForEvent}${md}`,
            "RRULE:FREQ=YEARLY",
            `SUMMARY:${summary}`,
            p.notes ? `DESCRIPTION:${p.notes.replace(/[,;\\]/g, "\\$&").replace(/\n/g, "\\n")}` : "DESCRIPTION:",
            "TRANSP:TRANSPARENT",
            "END:VEVENT",
          );
        });

        lines.push("END:VCALENDAR");
        return { ics: lines.join("\r\n"), count: exported.length };
      }

      function downloadIcs() {
        const { ics, count } = buildIcs();
        if (!count) {
          showToast("No dated people match the current filters.");
          return;
        }
        const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "family-calendar.ics";
        link.click();
        URL.revokeObjectURL(url);
        showToast(`Downloaded ${count} recurring ${count === 1 ? "birthday" : "birthdays"}. Import the .ics into Google or Apple Calendar.`);
      }

      let toastTimer;
      function showToast(message) {
        const toast = document.querySelector("#toast");
        toast.textContent = message;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 3200);
      }

      // --- Wire up ---
      function start() {
        if (!people.length && !holidays.length) {
          document.querySelector("#calendar").innerHTML =
            `<div class="surface rounded-2xl p-6 text-sm text-[color:var(--muted)]">Couldn't load the calendar data.</div>`;
          return;
        }

        rerender();

        document.querySelector("#search").addEventListener("input", (e) => {
          state.query = e.target.value.trim().toLowerCase();
          rerender();
        });

        document.querySelector("#group-filters").addEventListener("click", (e) => {
          const btn = e.target.closest("[data-group]");
          if (!btn) return;
          toggleSet(state.groups, btn.dataset.group, Object.keys(groups));
          rerender();
        });

        document.querySelector("#type-filters").addEventListener("click", (e) => {
          const btn = e.target.closest("[data-type]");
          if (!btn) return;
          toggleSet(state.types, btn.dataset.type, allTypes);
          rerender();
        });

        document.querySelector("#export-ics").addEventListener("click", downloadIcs);

        document.querySelector("#jump-today").addEventListener("click", () => {
          document.querySelector(`#month-${todayKey.slice(0, 7)}`)?.scrollIntoView({ block: "start" });
        });

        requestAnimationFrame(() => {
          document.querySelector(`#month-${todayKey.slice(0, 7)}`)?.scrollIntoView({ block: "start" });
        });
      }

      // Load from the server API.
      (async () => {
        let loaded = null;
        try {
          const res = await fetch("/api/data", { cache: "no-store" });
          if (res.ok) loaded = fromServer(await res.json());
        } catch {
          // Served without the Deno API; show the error state below.
        }
        ingest(loaded || { groups: {}, people: [], holidays: [] });
        start();
      })();
    </script>
  </body>
</html>
