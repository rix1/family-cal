<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Family Dates</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-50 text-zinc-950">
    <main class="mx-auto max-w-6xl px-4 py-8">
      <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <div class="flex items-center gap-3">
            <a href="/" class="text-sm font-medium text-zinc-500 hover:text-zinc-900">← Calendar</a>
            <a href="/about" class="text-sm font-medium text-zinc-500 hover:text-zinc-900"
            >About/API</a>
          </div>
          <h1 class="mt-1 text-2xl font-semibold tracking-normal">Edit family dates</h1>
          <p class="mt-1 max-w-2xl text-sm text-zinc-600">
            Add or change people. <span id="mode-hint"></span>
          </p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <input
            id="actor"
            type="text"
            placeholder="Your name"
            class="w-32 rounded-md border border-zinc-300 px-3 py-2 text-sm outline-none focus:border-zinc-900"
            title="Used to label your changes in the history"
          />
          <button
            id="add-row"
            type="button"
            class="rounded-md bg-zinc-900 px-4 py-2 text-sm font-medium text-white hover:bg-zinc-700"
          >
            Add person
          </button>
          <button
            id="save"
            type="button"
            class="hidden rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-600"
          >
            Save
          </button>
          <button
            id="copy"
            type="button"
            class="rounded-md border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-900 hover:bg-zinc-100"
          >
            Copy CSV
          </button>
          <button
            id="download"
            type="button"
            class="rounded-md border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-900 hover:bg-zinc-100"
          >
            Download CSV
          </button>
          <button
            id="reset"
            type="button"
            class="rounded-md border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-500 hover:bg-zinc-100"
            title="Discard local changes and reload"
          >
            Reset
          </button>
        </div>
      </div>

      <div
        id="draft-banner"
        class="mb-4 hidden rounded-md border border-amber-300 bg-amber-50 px-4 py-2 text-sm text-amber-900"
      >
        You have unsaved local changes. Save (or Download) to keep them, or Reset to discard.
      </div>

      <div class="mb-4 flex flex-wrap items-center gap-3 text-sm text-zinc-600">
        <span id="summary"></span>
      </div>

      <section class="overflow-x-auto rounded-md border border-zinc-200 bg-white">
        <table class="w-full min-w-[820px] border-collapse text-left text-sm">
          <thead class="bg-zinc-100 text-xs uppercase tracking-wide text-zinc-600">
            <tr>
              <th class="w-[22%] px-3 py-3 font-medium">Name</th>
              <th class="w-[15%] px-3 py-3 font-medium">Family</th>
              <th class="w-[14%] px-3 py-3 font-medium">Type</th>
              <th class="w-[17%] px-3 py-3 font-medium">Date</th>
              <th class="px-3 py-3 font-medium">Notes</th>
              <th class="w-16 px-3 py-3 font-medium"></th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-zinc-200"></tbody>
        </table>
      </section>

      <p class="mt-3 text-xs text-zinc-500">
        Date accepts <code>YYYY-MM-DD</code> (full date, enables age), <code>MM-DD</code>
        (recurring, year unknown), or leave blank if unknown.
      </p>
    </main>

    <template id="row-template">
      <tr>
        <td class="px-3 py-2">
          <input
            data-field="name"
            class="w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-zinc-900"
            placeholder="Name"
          />
        </td>
        <td class="px-3 py-2">
          <select
            data-field="group"
            class="w-full rounded-md border border-zinc-300 bg-white px-3 py-2 outline-none focus:border-zinc-900"
          >
          </select>
        </td>
        <td class="px-3 py-2">
          <select
            data-field="type"
            class="w-full rounded-md border border-zinc-300 bg-white px-3 py-2 outline-none focus:border-zinc-900"
          >
            <option value="birthday">birthday</option>
            <option value="anniversary">anniversary</option>
          </select>
        </td>
        <td class="px-3 py-2">
          <input
            data-field="date"
            class="w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-zinc-900"
            placeholder="1990-05-17 / 05-17"
          />
        </td>
        <td class="px-3 py-2">
          <input
            data-field="notes"
            class="w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-zinc-900"
            placeholder="Optional"
          />
        </td>
        <td class="px-3 py-2 text-right">
          <button
            type="button"
            data-remove
            class="rounded-md px-3 py-2 text-sm text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900"
          >
            Remove
          </button>
        </td>
      </tr>
    </template>

    <div
      id="toast"
      class="pointer-events-none fixed bottom-4 left-1/2 z-30 -translate-x-1/2 translate-y-2 rounded-md bg-zinc-900 px-4 py-2 text-sm text-white opacity-0 shadow-lg transition-all"
    >
    </div>

    <script>
      let groups = {};
      let groupKeys = [];
      let serverMode = false;

      const rows = document.querySelector("#rows");
      const template = document.querySelector("#row-template");
      const storageKey = "family-calendar-editor-draft";

      const dateValid = (v) => v === "" || /^\d{4}-\d{2}-\d{2}$/.test(v) || /^\d{2}-\d{2}$/.test(v);

      function addRow(values = {}) {
        const row = template.content.firstElementChild.cloneNode(true);

        // Carry server-only fields that have no column, so saves round-trip them.
        if (values.id) row.dataset.id = values.id;
        if (values.died) row.dataset.died = values.died;

        const groupSelect = row.querySelector('[data-field="group"]');
        groupSelect.innerHTML = groupKeys
          .map((key) => `<option value="${key}">${groups[key].flag} ${groups[key].label}</option>`)
          .join("");

        row.querySelectorAll("[data-field]").forEach((input) => {
          const field = input.dataset.field;
          if (values[field] != null) input.value = values[field];
        });
        if (!values.group && groupKeys.length) groupSelect.value = groupKeys[0];
        if (!values.type) row.querySelector('[data-field="type"]').value = "birthday";

        row.querySelector("[data-remove]").addEventListener("click", () => {
          row.remove();
          onChange();
        });
        rows.appendChild(row);
        return row;
      }

      function getRows() {
        return Array.from(rows.querySelectorAll("tr")).map((row) => {
          const get = (field) => row.querySelector(`[data-field="${field}"]`).value.trim();
          return {
            id: row.dataset.id || "",
            died: row.dataset.died || "",
            name: get("name"),
            date: get("date"),
            type: get("type") || "birthday",
            group: get("group"),
            notes: get("notes"),
          };
        });
      }

      /** Convert a server Person into the row shape this editor uses. */
      function serverPersonToRow(p) {
        return {
          id: p.id,
          died: p.died || "",
          name: p.name,
          date: p.born || "",
          type: "birthday",
          group: (p.groups && p.groups[0]) || groupKeys[0] || "",
          notes: p.notes || "",
        };
      }

      /** Convert editor rows into the server's Person shape. */
      function toServerPeople() {
        return getPeople().map((p) => ({
          id: p.id || undefined,
          name: p.name,
          born: p.date || "",
          died: p.died || null,
          groups: p.group ? [p.group] : [],
          notes: p.notes,
        }));
      }

      function getPeople() {
        // Keep only rows with at least a name; ignore fully empty rows.
        return getRows().filter((p) => p.name || p.date || p.notes);
      }

      function validate() {
        let invalid = 0;
        rows.querySelectorAll("tr").forEach((row) => {
          const input = row.querySelector('[data-field="date"]');
          const name = row.querySelector('[data-field="name"]').value.trim();
          const ok = dateValid(input.value.trim());
          input.classList.toggle("border-red-500", !ok);
          input.classList.toggle("bg-red-50", !ok);
          if (!ok && (name || input.value.trim())) invalid++;
        });
        return invalid;
      }

      function updateSummary() {
        const people = getPeople();
        const dated = people.filter((p) => p.date).length;
        const invalid = validate();
        const summary = document.querySelector("#summary");
        summary.innerHTML =
          `<strong>${people.length}</strong> people · <strong>${dated}</strong> with dates · <strong>${
            people.length - dated
          }</strong> missing` +
          (invalid
            ? ` · <span class="font-semibold text-red-600">${invalid} invalid date${
              invalid === 1 ? "" : "s"
            }</span>`
            : "");
      }

      function csvEscape(value) {
        const text = String(value ?? "");
        return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
      }

      function buildPeopleCsv() {
        const headers = ["id", "name", "born", "died", "groups", "notes"];
        const lines = [headers.join(",")];
        for (const p of toServerPeople()) {
          lines.push(
            [
              p.id || "",
              p.name,
              p.born || "",
              p.died || "",
              (p.groups || []).join("|"),
              p.notes || "",
            ]
              .map(csvEscape)
              .join(","),
          );
        }
        return lines.join("\n") + "\n";
      }

      function download() {
        if (validate() > 0) {
          showToast("Fix the highlighted dates first.");
          return;
        }
        const blob = new Blob([buildPeopleCsv()], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "people.csv";
        link.click();
        URL.revokeObjectURL(url);
        showToast("Downloaded people.csv backup.");
      }

      async function copyToClipboard() {
        if (validate() > 0) {
          showToast("Fix the highlighted dates first.");
          return;
        }
        try {
          await navigator.clipboard.writeText(buildPeopleCsv());
          showToast("Copied CSV to clipboard.");
        } catch {
          showToast("Couldn't access clipboard — use Download instead.");
        }
      }

      function saveDraft() {
        localStorage.setItem(storageKey, JSON.stringify(getPeople()));
        document.querySelector("#draft-banner").classList.remove("hidden");
      }

      function loadDraft() {
        try {
          const raw = localStorage.getItem(storageKey);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }

      function onChange() {
        updateSummary();
        saveDraft();
      }

      function loadPeople(people) {
        rows.innerHTML = "";
        if (people.length) people.forEach(addRow);
        else addRow();
        updateSummary();
      }

      let toastTimer;
      function showToast(message) {
        const toast = document.querySelector("#toast");
        toast.textContent = message;
        toast.classList.add("opacity-100", "translate-y-0");
        toast.classList.remove("opacity-0", "translate-y-2");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add("opacity-0", "translate-y-2");
          toast.classList.remove("opacity-100", "translate-y-0");
        }, 2600);
      }

      async function save() {
        if (validate() > 0) {
          showToast("Fix the highlighted dates first.");
          return;
        }
        const actorInput = document.querySelector("#actor");
        const actor = actorInput.value.trim();
        if (!actor) {
          showToast("Enter your name so changes can be attributed.");
          actorInput.focus();
          return;
        }
        try {
          const res = await fetch("/api/people", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ actor, people: toServerPeople() }),
          });
          const body = await res.json();
          if (!res.ok) {
            showToast(`Couldn't save: ${body.error || res.status}`);
            return;
          }
          localStorage.removeItem(storageKey);
          document.querySelector("#draft-banner").classList.add("hidden");
          loadPeople((body.people || []).map(serverPersonToRow));
          showToast(`Saved ${body.people.length} people as ${actor}.`);
        } catch {
          showToast("Couldn't reach the server. Use Download as a fallback.");
        }
      }

      async function reloadFromServer() {
        const d = await (await fetch("/api/data", { cache: "no-store" })).json();
        loadPeople((d.people || []).map(serverPersonToRow));
      }

      // Wire up
      document.querySelector("#add-row").addEventListener("click", () => {
        const row = addRow();
        row.querySelector('[data-field="name"]').focus();
        onChange();
      });
      document.querySelector("#save").addEventListener("click", save);
      document.querySelector("#download").addEventListener("click", download);
      document.querySelector("#copy").addEventListener("click", copyToClipboard);
      document.querySelector("#reset").addEventListener("click", async () => {
        localStorage.removeItem(storageKey);
        document.querySelector("#draft-banner").classList.add("hidden");
        if (serverMode) {
          await reloadFromServer();
          showToast("Reset to the saved calendar.");
        } else {
          rows.innerHTML = "";
          updateSummary();
          showToast("No server data is available.");
        }
      });
      rows.addEventListener("input", onChange);
      rows.addEventListener("change", onChange);

      // Persist the editor's name across visits.
      const actorInput = document.querySelector("#actor");
      actorInput.value = localStorage.getItem("editor-name") || "";
      actorInput.addEventListener("input", () => {
        localStorage.setItem("editor-name", actorInput.value.trim());
      });

      // Initial load: requires the server API. The old family-dates.js fallback
      // has intentionally been removed; CSV seed files are the bootstrap path.
      (async () => {
        let serverData = null;
        try {
          const res = await fetch("/api/data", { cache: "no-store" });
          if (res.ok) serverData = await res.json();
        } catch {
          // Served without the Deno API; show the server-required state below.
        }

        const draft = loadDraft();
        const modeHint = document.querySelector("#mode-hint");

        if (serverData) {
          serverMode = true;
          groups = {};
          for (const g of serverData.groups || []) groups[g.key] = { label: g.label, flag: g.flag };
          groupKeys = Object.keys(groups);
          document.querySelector("#save").classList.remove("hidden");
          modeHint.innerHTML =
            "Changes <strong>Save</strong> to the shared calendar; Download CSV is a backup.";
          if (draft && draft.length) {
            document.querySelector("#draft-banner").classList.remove("hidden");
            loadPeople(draft);
          } else {
            loadPeople((serverData.people || []).map(serverPersonToRow));
          }
        } else {
          modeHint.innerHTML =
            'This editor now requires the Deno server API. Start <code class="rounded bg-zinc-200 px-1">server/</code>, then reload.';
          rows.innerHTML = "";
          updateSummary();
        }
      })();
    </script>
  </body>
</html>
